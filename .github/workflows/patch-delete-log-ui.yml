name: Patch delete log UI
on:
  push:
    branches:
      - phase5/delete-log-ui
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/delete-log-ui
      - name: Add delete controls and tests
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx tests/phase5-delete-log-ui.test.mjs
          git commit -m "fix: add log deletion controls"
          git push origin HEAD:phase5/delete-log-ui
