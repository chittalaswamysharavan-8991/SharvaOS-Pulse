name: Phase 3 fail-closed runtime fix

on:
  push:
    branches: [phase3/supabase-runtime-cutover]
    paths: [.github/workflows/phase3-fail-closed-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/supabase-runtime-cutover
          fetch-depth: 0

      - name: Block implicit fallback and reconcile after queue drain
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/page.tsx';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(needle, replacement, label) {
            const first = source.indexOf(needle);
            if (first < 0 || source.indexOf(needle, first + needle.length) >= 0) {
              throw new Error(`expected exactly one ${label}`);
            }
            source = source.slice(0, first) + replacement + source.slice(first + needle.length);
          }

          replaceOnce(
            'const [dataOwner, setDataOwner] = useState<"d1" | "supabase">("d1");',
            'const [dataOwner, setDataOwner] = useState<"d1" | "supabase" | "unavailable">("unavailable");',
            'data-owner state',
          );

          const d1Block = [
            '        if (config.dataOwner === "d1") {',
            '          transportRef.current = createD1PulseTransport();',
            '          setDataOwner("d1");',
            '          setAuthPhase("d1");',
            '          setRuntimeNotice(config.requestedOwner === "supabase" ? config.reason : "");',
            '          setRuntimeReady(true);',
            '          setTransportVersion((value) => value + 1);',
            '          return;',
            '        }',
          ].join('\n');
          const d1AndBlocked = [
            '        if (config.dataOwner === "d1") {',
            '          transportRef.current = createD1PulseTransport();',
            '          setDataOwner("d1");',
            '          setAuthPhase("d1");',
            '          setRuntimeNotice("");',
            '          setRuntimeReady(true);',
            '          setTransportVersion((value) => value + 1);',
            '          return;',
            '        }',
            '        if (config.dataOwner === "blocked") {',
            '          transportRef.current = null;',
            '          setDataOwner("unavailable");',
            '          setAuthPhase("loading");',
            '          setRuntimeNotice(config.reason);',
            '          setSyncState("offline");',
            '          setRuntimeReady(true);',
            '          return;',
            '        }',
          ].join('\n');
          replaceOnce(d1Block, d1AndBlocked, 'D1 initialization block');

          const catchBlock = [
            '        transportRef.current = createD1PulseTransport();',
            '        setDataOwner("d1");',
            '        setAuthPhase("d1");',
            '        setRuntimeNotice(`Supabase configuration check failed; D1 rollback is active. ${errorMessage(error, "")}`.trim());',
            '        setRuntimeReady(true);',
            '        setTransportVersion((value) => value + 1);',
          ].join('\n');
          const blockedCatch = [
            '        transportRef.current = null;',
            '        setDataOwner("unavailable");',
            '        setAuthPhase("loading");',
            '        setRuntimeNotice(`Runtime owner check unavailable; changes remain queued on this device. ${errorMessage(error, "")}`.trim());',
            '        setSyncState("offline");',
            '        setRuntimeReady(true);',
          ].join('\n');
          replaceOnce(catchBlock, blockedCatch, 'runtime error fallback');

          const effectStart = [
            '  useEffect(() => {',
            '    const transport = transportRef.current;',
            '    if (!runtimeReady || !transport) return;',
            '    const activeTransport = transport;',
            '    let active = true;',
          ].join('\n');
          const safeEffectStart = [
            '  useEffect(() => {',
            '    if (!runtimeReady) return;',
            '    const configuredTransport = transportRef.current;',
            '    let active = true;',
          ].join('\n');
          replaceOnce(effectStart, safeEffectStart, 'runtime load effect start');

          const cacheBoundary = [
            '        if (active && (cached.logs.length || cached.todos.length)) setDay(cached);',
            '      } catch {}',
            '      try {',
            '        const remote = await activeTransport.readDay(date) as DayState;',
          ].join('\n');
          const safeCacheBoundary = [
            '        if (active && (cached.logs.length || cached.todos.length)) setDay(cached);',
            '      } catch {}',
            '      if (!configuredTransport) {',
            '        if (active) {',
            '          setSyncState("offline");',
            '          setReady(true);',
            '        }',
            '        return;',
            '      }',
            '      const activeTransport = configuredTransport;',
            '      try {',
            '        const remote = await activeTransport.readDay(date) as DayState;',
          ].join('\n');
          replaceOnce(cacheBoundary, safeCacheBoundary, 'cache-to-transport boundary');

          const reconciliationBlock = [
            '        let nextDay = applyPendingOperations(remote, pending) as DayState;',
            '        const missingCached = selectMissingDayEntries(cached, remote) as DayState;',
            '        if (!pending.length && (missingCached.logs.length || missingCached.todos.length)) {',
            '          nextDay = await activeTransport.importDay(date, missingCached, `device-initial:${date}`) as DayState;',
            '        }',
            '        setDay(nextDay);',
            '        if (pending.length) await flushPending();',
            '        else setSyncState("synced");',
          ].join('\n');
          const queueThenReconcile = [
            '        let nextDay = applyPendingOperations(remote, pending) as DayState;',
            '        setDay(nextDay);',
            '        if (pending.length) {',
            '          await flushPending();',
            '          if (pendingRef.current.length) return;',
            '          const confirmed = await activeTransport.readDay(date) as DayState;',
            '          const missingAfterQueue = selectMissingDayEntries(cached, confirmed) as DayState;',
            '          nextDay = missingAfterQueue.logs.length || missingAfterQueue.todos.length',
            '            ? await activeTransport.importDay(date, missingAfterQueue, `device-initial:${date}`) as DayState',
            '            : confirmed;',
            '          setDay(nextDay);',
            '          setSyncState("synced");',
            '        } else {',
            '          const missingCached = selectMissingDayEntries(cached, remote) as DayState;',
            '          if (missingCached.logs.length || missingCached.todos.length) {',
            '            nextDay = await activeTransport.importDay(date, missingCached, `device-initial:${date}`) as DayState;',
            '            setDay(nextDay);',
            '          }',
            '          setSyncState("synced");',
            '        }',
          ].join('\n');
          replaceOnce(reconciliationBlock, queueThenReconcile, 'queue reconciliation block');

          replaceOnce(
            '${dataOwner === "supabase" ? "Supabase" : "D1 fallback"}',
            '${dataOwner === "supabase" ? "Supabase" : dataOwner === "d1" ? "D1 rollback" : "Sync blocked"}',
            'header owner label',
          );
          replaceOnce(
            '{runtimeNotice ? "Rollback active" : "Press & hold any card"}',
            '{runtimeNotice ? (dataOwner === "unavailable" ? "Sync blocked" : "Rollback active") : "Press & hold any card"}',
            'runtime notice heading',
          );
          replaceOnce(
            '{syncState === "synced" ? (dataOwner === "supabase" ? "Supabase canonical" : "D1 rollback") : "Offline cache"}',
            '{syncState === "synced" ? (dataOwner === "supabase" ? "Supabase canonical" : dataOwner === "d1" ? "D1 rollback" : "Sync blocked") : "Offline cache"}',
            'footer owner label',
          );

          for (const expected of [
            'dataOwner: "blocked"',
            'setDataOwner("unavailable")',
            'const configuredTransport = transportRef.current;',
            'const missingAfterQueue = selectMissingDayEntries(cached, confirmed)',
            'Runtime owner check unavailable; changes remain queued on this device.',
          ]) if (!source.includes(expected)) throw new Error(`safety marker missing: ${expected}`);
          if (source.includes('Supabase configuration check failed; D1 rollback is active')) throw new Error('implicit D1 fallback remains');

          fs.writeFileSync(path, source);
          NODE
          git diff --check

      - name: Commit safe runtime and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-fail-closed-fix.yml
          git add app/page.tsx
          git commit -m "fix: require explicit rollback and reconcile after queue drain"
          git push origin HEAD:phase3/supabase-runtime-cutover
