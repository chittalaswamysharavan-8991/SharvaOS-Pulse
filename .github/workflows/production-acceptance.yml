name: Production Acceptance

on:
  pull_request:
    paths:
      - "scripts/verify-production-acceptance.mjs"
      - "tests/phase5-production-acceptance.test.mjs"
      - "tests/phase5-rollback-safety.test.mjs"
      - "lib/pulse-public-runtime.mjs"
      - "app/api/health/route.ts"
      - "docs/PHASE5-PRODUCTION-ACCEPTANCE.md"
      - "docs/GOOGLE-AUTH-CUTOVER.md"
      - "docs/GOOGLE-AUTH-EVIDENCE.md"
      - ".github/workflows/production-acceptance.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/verify-production-acceptance.mjs"
      - "tests/phase5-production-acceptance.test.mjs"
      - "tests/phase5-rollback-safety.test.mjs"
      - "lib/pulse-public-runtime.mjs"
      - "app/api/health/route.ts"
      - "docs/PHASE5-PRODUCTION-ACCEPTANCE.md"
      - "docs/GOOGLE-AUTH-CUTOVER.md"
      - "docs/GOOGLE-AUTH-EVIDENCE.md"
      - ".github/workflows/production-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify live production contract
        env:
          SHARVAOS_PULSE_PRODUCTION_URL: https://sharvaos-pulse-google.vercel.app
          EXPECTED_VERSION: 2.2.0
          EXPECTED_CONTRACT: sharvaos.pulse.v1
        run: node scripts/verify-production-acceptance.mjs

      - name: Verify deployed source belongs to main
        run: |
          DEPLOYED_COMMIT="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("verification/phase5-production-acceptance.json", "utf8")).sourceCommit)')"
          git cat-file -e "${DEPLOYED_COMMIT}^{commit}"
          git merge-base --is-ancestor "$DEPLOYED_COMMIT" origin/main

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: sharvaos-pulse-phase5-production-acceptance
          path: verification/phase5-production-acceptance.json
