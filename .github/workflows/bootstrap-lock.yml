name: Bootstrap exact source and lockfile

on:
  push:
    branches:
      - import/sharvaos-pulse-v2

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct exact large source files
        shell: bash
        run: |
          mkdir -p app
          cat .bootstrap/page.tsx.part* > app/page.tsx
          cat .bootstrap/globals.css.part* > app/globals.css
          echo "25dbbe927d77520bea38827a43bded750c8cfa6bec38b7059d1f236eeeeea55c  app/page.tsx" | sha256sum -c -
          echo "ca822bb74d7131dc39b84c0ce1cc3efbff28ecb3422ec36e2f2aefe79ed5f78d  app/globals.css" | sha256sum -c -

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify normalized version
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (p.version !== '2.0.0' || l.version !== '2.0.0' || l.packages[''].version !== '2.0.0') process.exit(1)"

      - name: Commit reconstructed source and lockfile
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: reconstruct exact source and normalized lockfile"
          git push
