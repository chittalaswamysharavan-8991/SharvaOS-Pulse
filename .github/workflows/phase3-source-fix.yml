name: Phase 3 source fix

on:
  push:
    branches: [phase3/supabase-runtime-cutover]
    paths: [.github/workflows/phase3-source-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/supabase-runtime-cutover
          fetch-depth: 0

      - name: Apply exact transport narrowing fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/page.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const startNeedle = '  useEffect(() => {\n    const transport = transportRef.current;\n    if (!runtimeReady || !transport) return;';
          const endNeedle = '  }, [date, flushPending, pendingKey, requireSignIn, runtimeReady, storageKey, transportVersion]);';
          const start = source.indexOf(startNeedle);
          const end = source.indexOf(endNeedle, start);
          if (start < 0 || end < 0) throw new Error('load effect boundary not found');

          let block = source.slice(start, end + endNeedle.length);
          block = block.replace(
            '    if (!runtimeReady || !transport) return;\n    let active = true;',
            '    if (!runtimeReady || !transport) return;\n    const activeTransport = transport;\n    let active = true;',
          );
          block = block.replace(
            'const remote = await transport.readDay(date) as DayState;',
            'const remote = await activeTransport.readDay(date) as DayState;',
          );
          block = block.replace(
            'nextDay = await transport.importDay(date, cached, `device-initial:${date}`) as DayState;',
            'nextDay = await activeTransport.importDay(date, cached, `device-initial:${date}`) as DayState;',
          );
          block = block.replace(
            'if (transport.owner === "supabase" && errorStatus(error) === 401) {',
            'if (activeTransport.owner === "supabase" && errorStatus(error) === 401) {',
          );

          for (const expected of [
            'const activeTransport = transport;',
            'activeTransport.readDay(date)',
            'activeTransport.importDay(date, cached',
            'activeTransport.owner === "supabase"',
          ]) if (!block.includes(expected)) throw new Error(`fix marker missing: ${expected}`);
          if (block.includes('await transport.readDay(date)') || block.includes('await transport.importDay(date, cached') || block.includes('if (transport.owner === "supabase"')) {
            throw new Error('nullable transport reference remains in load effect');
          }

          source = source.slice(0, start) + block + source.slice(end + endNeedle.length);
          fs.writeFileSync(path, source);
          NODE
          git diff --check

      - name: Commit fixed source and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-source-fix.yml
          git add app/page.tsx
          git commit -m "fix: preserve non-null runtime transport in load effect"
          git push origin HEAD:phase3/supabase-runtime-cutover
