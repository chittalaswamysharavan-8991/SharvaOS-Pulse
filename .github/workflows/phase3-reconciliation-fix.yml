name: Phase 3 reconciliation fix

on:
  push:
    branches: [phase3/supabase-runtime-cutover]
    paths: [.github/workflows/phase3-reconciliation-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/supabase-runtime-cutover
          fetch-depth: 0

      - name: Connect partial-day reconciliation to UI load
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/page.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const importNeedle = '  createCanonicalPulseTransport,\n  createD1PulseTransport,\n} from "../lib/pulse-transport.mjs";';
          const importReplacement = '  createCanonicalPulseTransport,\n  createD1PulseTransport,\n  selectMissingDayEntries,\n} from "../lib/pulse-transport.mjs";';
          if (!source.includes(importNeedle)) throw new Error('transport import boundary not found');
          source = source.replace(importNeedle, importReplacement);

          const oldBlock = `        let nextDay = applyPendingOperations(remote, pending) as DayState;
        if (!pending.length && !remote.logs.length && !remote.todos.length && (cached.logs.length || cached.todos.length)) {
          nextDay = await activeTransport.importDay(date, cached, \`device-initial:\${date}\`) as DayState;
        }`;
          const newBlock = `        let nextDay = applyPendingOperations(remote, pending) as DayState;
        const missingCached = selectMissingDayEntries(cached, remote) as DayState;
        if (!pending.length && (missingCached.logs.length || missingCached.todos.length)) {
          nextDay = await activeTransport.importDay(date, missingCached, \`device-initial:\${date}\`) as DayState;
        }`;
          if (!source.includes(oldBlock)) throw new Error('initial import block not found');
          source = source.replace(oldBlock, newBlock);

          for (const expected of ['selectMissingDayEntries,', 'const missingCached = selectMissingDayEntries(cached, remote)', 'importDay(date, missingCached']) {
            if (!source.includes(expected)) throw new Error(`reconciliation marker missing: ${expected}`);
          }
          if (source.includes('!remote.logs.length && !remote.todos.length')) throw new Error('empty-remote-only cutover condition remains');
          fs.writeFileSync(path, source);
          NODE
          git diff --check

      - name: Commit reconciled source and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-reconciliation-fix.yml
          git add app/page.tsx
          git commit -m "fix: reconcile missing device entries into partial canonical days"
          git push origin HEAD:phase3/supabase-runtime-cutover
