name: Package Vercel Production

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - ".github/workflows/package-vercel-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-vercel-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Assemble immutable Vercel source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p deploy-source/app/api/health deploy-source/app/api/runtime-config deploy-source/app/pulse deploy-source/lib deploy-source/public
          sed -e 's#../../lib/#../lib/#g' -e 's#`${window.location.origin}/today`#window.location.origin#g' app/today/page.tsx > deploy-source/app/page.tsx
          cp app/today/today.module.css deploy-source/app/today.module.css
          cp app/page.tsx deploy-source/app/pulse-client.tsx
          cat > deploy-source/app/pulse/page.tsx <<'PULSEEOF'
          export { default } from "../pulse-client";
          PULSEEOF
          cp app/layout.tsx app/globals.css deploy-source/app/
          cp app/api/runtime-config/route.ts deploy-source/app/api/runtime-config/route.ts
          cp lib/pulse-auth-client.mjs lib/pulse-auth-client.d.mts deploy-source/lib/
          cp lib/pulse-canonical-client.mjs lib/pulse-canonical-client.d.mts deploy-source/lib/
          cp lib/pulse-runtime-config.mjs lib/pulse-runtime-config.d.mts deploy-source/lib/
          cp lib/pulse-transport.mjs lib/pulse-transport.d.mts deploy-source/lib/
          cp lib/pulse-reliability.mjs lib/pulse-reliability.d.mts deploy-source/lib/
          cp lib/pulse-public-runtime.mjs lib/pulse-public-runtime.d.mts deploy-source/lib/
          cp lib/sharvaos-read-model.mjs lib/sharvaos-read-model.d.mts deploy-source/lib/
          cp public/favicon.svg deploy-source/public/favicon.svg
          cat > deploy-source/app/api/health/route.ts <<HEALTHEOF
          import { NextResponse } from "next/server";
          import { resolvePulseRuntimeValues } from "../../../lib/pulse-public-runtime.mjs";

          export const dynamic = "force-dynamic";
          const SOURCE_COMMIT = "${SOURCE_COMMIT}";

          export async function GET() {
            const runtime = resolvePulseRuntimeValues(process.env);
            const ready = runtime.cutoverReady && runtime.dataOwner !== "blocked";
            const authentication = runtime.dataOwner === "supabase"
              ? "owner-session-required"
              : runtime.dataOwner === "d1"
                ? "platform-identity"
                : "blocked";
            return NextResponse.json({
              status: ready ? "ready" : "blocked",
              version: "2.3.0",
              contract: "sharvaos.pulse.v1",
              surface: "sharvaos.today.front-door.v1",
              requestedOwner: runtime.requestedOwner,
              dataOwner: runtime.dataOwner,
              configSource: runtime.configSource,
              canonicalFunction: runtime.dataOwner === "supabase" ? "configured" : "not-configured",
              authentication,
              rollback: "D1 requires the exact release on a Cloudflare runtime with a live DB binding",
              reason: runtime.reason ?? null,
              sourceCommit: SOURCE_COMMIT,
            }, {
              status: ready ? 200 : 503,
              headers: { "cache-control": "no-store, max-age=0", "x-content-type-options": "nosniff" },
            });
          }
          HEALTHEOF
          cat > deploy-source/package.json <<'PKGEOF'
          {
            "name": "sharvaos-pulse-google",
            "version": "2.3.0",
            "private": true,
            "scripts": { "build": "next build" },
            "dependencies": {
              "next": "16.2.6",
              "react": "19.2.6",
              "react-dom": "19.2.6",
              "tailwindcss": "4.2.1",
              "@tailwindcss/postcss": "4.2.1"
            },
            "devDependencies": {
              "@types/node": "22.19.19",
              "@types/react": "19.2.14",
              "@types/react-dom": "19.2.3",
              "typescript": "5.9.3"
            }
          }
          PKGEOF
          cat > deploy-source/tsconfig.json <<'TSEOF'
          {
            "compilerOptions": {
              "target": "ES2017",
              "lib": ["dom", "dom.iterable", "esnext"],
              "allowJs": true,
              "skipLibCheck": true,
              "strict": true,
              "noEmit": true,
              "esModuleInterop": true,
              "module": "esnext",
              "moduleResolution": "bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "jsx": "react-jsx",
              "incremental": true,
              "plugins": [{ "name": "next" }]
            },
            "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", "**/*.d.mts", ".next/types/**/*.ts"],
            "exclude": ["node_modules"]
          }
          TSEOF
          cat > deploy-source/postcss.config.mjs <<'POSTCSSEOF'
          export default { plugins: { "@tailwindcss/postcss": {} } };
          POSTCSSEOF
          cat > deploy-source/next-env.d.ts <<'NEXTENVEOF'
          /// <reference types="next" />
          /// <reference types="next/image-types/global" />
          NEXTENVEOF

      - name: Verify production package builds
        working-directory: deploy-source
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build

      - name: Archive exact package
        run: |
          cd deploy-source
          zip -qr ../sharvaos-pulse-vercel-${GITHUB_SHA}.zip . -x "node_modules/*" ".next/*"

      - name: Upload immutable package
        uses: actions/upload-artifact@v4
        with:
          name: sharvaos-pulse-vercel-${{ github.sha }}
          path: sharvaos-pulse-vercel-${{ github.sha }}.zip
          if-no-files-found: error
