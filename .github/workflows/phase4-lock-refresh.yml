name: Phase 4 lock refresh

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'phase4/production-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify release version
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (p.version !== '2.2.0' || l.version !== '2.2.0' || l.packages[''].version !== '2.2.0') process.exit(1)"

      - name: Commit normalized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already normalized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: normalize v2.2.0 lockfile'
          git push origin HEAD:${{ github.head_ref }}
